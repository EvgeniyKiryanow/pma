name: Checks

# Every push and pull request: types, lint, tests and a start of the built app on Windows,
# macOS and Linux. The release workflow runs the same checks before it builds installers.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Types and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  test:
    name: Tests and start (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-14 }
          - { name: Linux, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      # Ubuntu 24.04 forbids the user namespaces Chromium's sandbox needs unless the app has an
      # AppArmor profile (the .deb installs one); the unpacked dev copy has none.
      - name: Allow the Chromium sandbox (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Start the app (fresh install and upgrade of an old database)
        if: runner.os != 'Linux'
        run: npm run smoke
      - name: Start the app (fresh install and upgrade of an old database)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke
