name: Checks

# Every push and pull request: types, lint, tests and a start of the built app on Windows,
# macOS and Linux. The release workflow runs the same checks before it builds installers.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Types and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  test:
    name: Tests and start (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-2022: node-gyp (run by npm ci for the SQLite driver) does not recognise the
          # newer Visual Studio on windows-latest yet.
          - { name: Windows, os: windows-2022 }
          - { name: macOS, os: macos-14 }
          - { name: Linux, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      # Ubuntu 24.04 forbids the user namespaces Chromium's sandbox needs unless the app has an
      # AppArmor profile (the .deb installs one); the unpacked dev copy has none.
      - name: Allow the Chromium sandbox (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Start the app (fresh install and upgrade of an old database)
        if: runner.os != 'Linux'
        run: npm run smoke
      - name: Start the app (fresh install and upgrade of an old database)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke

  windows-32:
    name: Start and package (Windows 32-bit)
    # windows-2022: Visual Studio 2022 compiles the 32-bit SQLite driver (node-gyp does not
    # recognise the newer Visual Studio on windows-latest yet).
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 32-bit native modules
        run: node scripts/prepare-ia32.mjs
      - name: Start the app in 32-bit Electron
        run: npm run smoke -- --arch=ia32
      - name: Package (checks the 32-bit binaries)
        run: npx electron-builder --win --ia32 --dir --config electron-builder.ia32.yml
